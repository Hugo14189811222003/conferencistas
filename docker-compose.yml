version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: conferencistas-db
    environment:
      POSTGRES_DB: conferencistas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-backend:
    build:
      context: ./api-backend
      dockerfile: Dockerfile
    container_name: conferencistas-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: conferencistas
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 5m
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: noreply@conferencistas.com
      SMTP_PASSWORD: smtp-password
      SMTP_FROM: Conferencistas <noreply@conferencistas.com>
      FRONTEND_URL: http://localhost
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend-server:
    build:
      context: ./frontend-server
      dockerfile: Dockerfile
    container_name: conferencistas-frontend
    ports:
      - "8081:80"
    depends_on:
      - api-backend
    restart: unless-stopped

volumes:
  postgres_data:
